name: Firebase Deploy

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'database.rules.json'
      - 'firebase.json'
      - '.firebaserc'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Detect changed paths
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -q "^database.rules.json$"; then
            echo "rules=true" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -qE "^functions/" || echo "$CHANGED" | grep -q "^firebase.json$"; then
            echo "functions=true" >> $GITHUB_OUTPUT
          fi

      - name: Install function dependencies
        if: steps.changes.outputs.functions == 'true'
        working-directory: functions
        run: npm install

      - name: Deploy database rules
        if: steps.changes.outputs.rules == 'true'
        run: firebase deploy --only database --project ramex-kasa --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy functions
        if: steps.changes.outputs.functions == 'true'
        run: firebase deploy --only functions --project ramex-kasa --token "$FIREBASE_TOKEN" --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
